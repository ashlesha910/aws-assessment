AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Containerized compute stack - ECS Fargate cluster, task definitions and
  services for the Next.js frontend and the Python backend, with auto scaling,
  CloudWatch logging, and Secrets Manager integration. INFRASTRUCTURE stack.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, staging, prod]
  FrontendImage:
    Type: String
    Description: Full image URI:tag for the frontend (seed value; app pipeline updates tasks).
  BackendImage:
    Type: String
    Description: Full image URI:tag for the backend (seed value; app pipeline updates tasks).
  FrontendDesiredCount:
    Type: Number
    Default: 2
  BackendDesiredCount:
    Type: Number
    Default: 2
  TaskCpu:
    Type: String
    Default: "512"
  TaskMemory:
    Type: String
    Default: "1024"

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${EnvironmentName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${EnvironmentName}/frontend"
      RetentionInDays: 30

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${EnvironmentName}/backend"
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - Fn::ImportValue: !Sub "${EnvironmentName}-DBSecretArn"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: app-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - Fn::ImportValue: !Sub "${EnvironmentName}-DBSecretArn"

  FrontendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-frontend"
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: frontend
          Image: !Ref FrontendImage
          Essential: true
          PortMappings:
            - ContainerPort: 3000
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: BACKEND_URL
              Value: !Sub
                - "http://${Dns}/api/backend"
                - Dns:
                    Fn::ImportValue: !Sub "${EnvironmentName}-LoadBalancerDNS"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  BackendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-backend"
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref EnvironmentName
          Secrets:
            # Inject DB credentials from Secrets Manager at container start.
            - Name: DB_SECRET
              ValueFrom:
                Fn::ImportValue: !Sub "${EnvironmentName}-DBSecretArn"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  FrontendService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${EnvironmentName}-frontend"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref FrontendTaskDef
      DesiredCount: !Ref FrontendDesiredCount
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split
            - ","
            - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnets"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${EnvironmentName}-AppSecurityGroupId"
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 3000
          TargetGroupArn:
            Fn::ImportValue: !Sub "${EnvironmentName}-FrontendTargetGroupArn"

  BackendService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${EnvironmentName}-backend"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref BackendTaskDef
      DesiredCount: !Ref BackendDesiredCount
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split
            - ","
            - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnets"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${EnvironmentName}-AppSecurityGroupId"
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8000
          TargetGroupArn:
            Fn::ImportValue: !Sub "${EnvironmentName}-BackendTargetGroupArn"

  # ---------- Auto scaling (backend example; mirror for frontend) ----------
  BackendScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 6
      MinCapacity: !Ref BackendDesiredCount
      ResourceId: !Sub "service/${Cluster}/${BackendService.Name}"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"

  BackendCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${EnvironmentName}-backend-cpu"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref BackendScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 65.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

Outputs:
  ClusterName:
    Value: !Ref Cluster
    Export:
      Name: !Sub "${EnvironmentName}-ClusterName"
  FrontendServiceName:
    Value: !GetAtt FrontendService.Name
  BackendServiceName:
    Value: !GetAtt BackendService.Name
