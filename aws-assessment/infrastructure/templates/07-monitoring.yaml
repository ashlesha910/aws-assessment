AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Monitoring stack - SNS alert topic, CloudWatch alarms for the ALB, ECS and
  RDS, plus a consolidated dashboard. INFRASTRUCTURE stack.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, staging, prod]
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email to subscribe to CloudWatch alarm notifications.

Conditions:
  HasEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${EnvironmentName}-alerts"

  AlertsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  DbCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-rds-cpu-high"
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Sub "${EnvironmentName}-postgres"
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  DbStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-rds-storage-low"
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Sub "${EnvironmentName}-postgres"
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2000000000 # 2 GB
      ComparisonOperator: LessThanThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  Alb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-alb-5xx-high"
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${EnvironmentName}-overview"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "ALB Request Count & 5XX",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/ApplicationELB", "RequestCount" ],
                  [ "AWS/ApplicationELB", "HTTPCode_Target_5XX_Count" ]
                ],
                "period": 300, "stat": "Sum"
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "RDS CPU & Connections",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${EnvironmentName}-postgres" ],
                  [ "AWS/RDS", "DatabaseConnections", "DBInstanceIdentifier", "${EnvironmentName}-postgres" ]
                ],
                "period": 300, "stat": "Average"
              }
            }
          ]
        }

Outputs:
  AlertsTopicArn:
    Value: !Ref AlertsTopic
    Export:
      Name: !Sub "${EnvironmentName}-AlertsTopicArn"
